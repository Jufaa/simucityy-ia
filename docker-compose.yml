services:
  db:
    image: postgis/postgis:17-3.5
    restart: unless-stopped
    environment:
      POSTGRES_DB: simulicity
      POSTGRES_USER: simulicity
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env before starting the optional database}
    ports:
      - '127.0.0.1:5433:5432'
    volumes:
      - simulicity-db:/var/lib/postgresql/data
      - ./packages/database/prisma/init-postgis.sql:/docker-entrypoint-initdb.d/10-postgis.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U simulicity -d simulicity']
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  simulicity-db:
